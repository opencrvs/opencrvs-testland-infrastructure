all:
  vars:
    ansible_user: provision
    single_node: false
    users: []
    # OrbStack's guest kernel denies conntrack sysctl writes from non-init
    # netns; skip kube-proxy's auto-tuning of nf_conntrack_max here only.
    disable_conntrack_tuning: true
    kube_cluster_env: local-dev

  children:
    master:
      hosts:
        master:
          ansible_host: master.orb.local
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          labels:
            traefik-role: ingress
            role: data1

    workers:
      hosts:
        worker0:
          ansible_host: worker.orb.local
          ansible_ssh_common_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          labels:
            role: data2
