ansible_python_interpreter: /usr/bin/python3

crontab_user: root
provisioning_user: provision

# User for ssh connection to backup server
backup_server_user: 'backup'
# Home directory for user on backup server
backup_server_user_home: '/home/backup'
# Amount of backups to keep (one week)
amount_of_backups_to_keep: 7

# Disk Encryption key location as an example (in production use a hardware security module)
disk_encryption_key_path: /root/disk-encryption-key.txt

# Path to encrypted file with citizens data
data_file_path: /cryptfs_file_sparse.img

# Minimum required disk space for successful kubernetes deployment
min_free_disk_size: "30g"
# Kubernetes components versions:
# - kubeadm
# - kubelet
# - kubectl
kubernetes_version: "v1.35"

# Kubernetes Eviction Policy Configuration
#
# By default, Kubernetes uses percentage thresholds to trigger disk evictions.
# OpenCRVS servers often have large disk partitions, so specifying absolute disk
# sizes is more effective and makes disk management predictable.
#
# OpenCRVS recommends:
#   - Keeping at least 10GiB of free disk space for safe upgrades and stable operation.
#   - Using absolute values for eviction thresholds to avoid unnecessary evictions or outages.
#
# The settings below define the minimum free disk space (in GiB) required before Kubernetes will start evicting pods.
# NOTE: Even if root (/) and container images are located on the same partition both policies must be explicitly defined
# --- Hard Eviction Thresholds ---
# If free disk space drops below this value, Kubernetes immediately evicts pods to free up space.
eviction_hard_nodefs: "10Gi"          # Minimum free space on root (/) filesystem
eviction_hard_imagefs: "10Gi"         # Minimum free space for container images

# --- Soft Eviction Thresholds ---
# If free disk space stays below this value for a sustained period, Kubernetes will evict pods gradually.
eviction_soft_nodefs: "20Gi"          # Minimum free space on root (/) filesystem over time
eviction_soft_imagefs: "20Gi"         # Minimum free space for container images over time

# Ports required for Kubernetes cluster node-to-node communication (used for firewall/UFW rules)
cluster_communication_ports:
    # Kubelet API (required for all nodes)
    - { port: 10250, proto: "tcp" }
    # kube-scheduler (control plane only)
    - { port: 10251, proto: "tcp" }
    # kube-controller-manager (control plane only)
    - { port: 10252, proto: "tcp" }
    # Overlay network (Calico/Weave/Flannel, if used—verify your CNI and usage)
    - { port: 7946, proto: "tcp" }   # Used by some CNIs (e.g., Flannel, Weave)
    - { port: 7946, proto: "udp" }   # Used by some CNIs (e.g., Flannel, Weave)
    - { port: 8472, proto: "udp" }   # VXLAN (Flannel/Calico; verify if needed)
    - { port: 4789, proto: "udp" }   # VXLAN (Calico; verify if needed)
    - { port: 179, proto: "tcp" }    # BGP (Calico)
    - { port: 179, proto: "udp" }    # BGP (Calico)

# CIDR(s) allowed to access Kubernetes API server, comma-separated (used for UFW rules, default: cluster nodes only)
kube_api_allowed_cidrs: ""

# Container Network Interface plugin: Calico version
calico_version: "v3.32.0"
# CNI configuration (read-only after installation)
pod_network_cidr: "192.168.0.0/16"

# Helm version
# Helm 4 is not yet compatible with kubernetes.core.helm module commands.
# see: 
# - https://docs.ansible.com/projects/ansible/latest/collections/kubernetes/core/helm_module.html
# - https://github.com/helm/helm/pull/31828
helm_version: "v3.21.1"

# Certificate manager chart version
cert_manager_version: "v1.20.2"

# Action runner controller chart version
arc_chart_version: "0.23.7"

# Postgres: differencial backup support (pgBackRest) version
pgbackrest_version: "2.59.0"