- name: Ensure users are present
  user:
    name: '{{ item.name }}'
    state: '{{ item.state }}'
  with_items: '{{ users }}'

# A removed user must not leave access behind: a later account with the same name would inherit it
- name: Remove sudo rules of removed users
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ item.name }}
    state: absent
  become: yes
  when: item.state == 'absent'
  with_items: '{{ users }}'
  loop_control:
    label: "{{ item.name }}"

# Users without SSH keys in the inventory have no access either
- name: Remove SSH keys and kube config of removed users and users without SSH keys
  ansible.builtin.file:
    path: /home/{{ item.0.name }}/{{ item.1 }}
    state: absent
  become: yes
  when: >-
    item.0.state == 'absent'
    or (item.0.name not in [ansible_user, backup_server_user] and item.0.ssh_keys | default([]) | length == 0)
  with_nested:
    - '{{ users }}'
    - ['.ssh', '.kube']
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"

- name: Grant passwordless sudo to admin users, but prevent usage of 'su'
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ item.name }}
    line: '{{ item.name }} ALL=(ALL) NOPASSWD:ALL, !/usr/bin/su'
    validate: 'visudo -cf %s'
    create: yes
  become: yes
  when:
    - item.state == 'present'
    - item.role == 'admin'
  with_items: '{{ users }}'
  loop_control:
    label: "{{ item.name }}"

- name: Add operator users to the adm group
  ansible.builtin.user:
    name: '{{ item.name }}'
    groups: adm
    append: yes
  become: yes
  when:
    - item.state == 'present'
    - item.role == 'operator'
  with_items: '{{ users }}'
  loop_control:
    label: "{{ item.name }}"

# FIXME: Remove after v2.3 release:
# Sudo rules that earlier versions created for operators must not stay behind
- name: Remove sudo rules of operator users
  ansible.builtin.file:
    path: /etc/sudoers.d/{{ item.name }}
    state: absent
  become: yes
  when:
    - item.state == 'present'
    - item.role == 'operator'
  with_items: '{{ users }}'
  loop_control:
    label: "{{ item.name }}"

- name: Grant passwordless sudo to admin users on backup host
  ansible.builtin.lineinfile:
    path: /etc/sudoers.d/{{ item.name }}
    line: '{{ item.name }} ALL=(ALL) NOPASSWD:ALL, !/usr/bin/su'
    validate: 'visudo -cf %s'
    create: yes
  become: yes
  when:
    - item.state == 'present'
    - item.role == 'admin'
    - "'backup' in group_names"
  with_items: "{{ users }}"
  loop_control:
    label: "{{ item.name }}"

# The keys of a user are exactly the ssh_keys in the inventory, so a removed key loses access
- name: Set authorized keys for users
  authorized_key:
    user: '{{ item.name }}'
    key: "{{ item.ssh_keys | join('\n') }}"
    exclusive: true
  when:
    - item.state == 'present'
    - item.name not in [ansible_user, backup_server_user]
    - item.ssh_keys | default([]) | length > 0
  with_items: '{{ users }}'
  loop_control:
    label: "{{ item.name }}"

- name: Ensure user's shell is bash
  user:
    name: '{{ item.name }}'
    shell: /bin/bash
  when: item.state == 'present'
  with_items: '{{ users }}'

- name: Ensure TERM is set in .bashrc
  lineinfile:
    path: /home/{{ item.name }}/.bashrc
    line: 'export TERM=xterm'
    create: yes
  when: item.state == 'present'
  with_items: '{{ users }}'

- name: Ensure history has timestamps
  lineinfile:
    path: /home/{{ item.name }}/.bashrc
    line: 'export HISTTIMEFORMAT="%d/%m/%y %T "'
    create: yes
  when: item.state == 'present'
  with_items: '{{ users }}'

# FIXME: v2.4: Remove this task after v2.4 release
# Clean up after previous versions that set up 2FA from .profile. sshd does it now (see "Require 2FA set-up" below)
- name: Remove 2FA setup lines from .profile of each user
  blockinfile:
    path: '/home/{{ item.name }}/.profile'
    state: absent
  register: profile_cleanup
  # blockinfile fails (rc 257) when the file does not exist, and then there is nothing to remove
  failed_when: profile_cleanup.failed and profile_cleanup.rc | default(0) != 257
  when: item.state == 'present'
  with_items: '{{ users }}'

- name: 'Install libpam-google-authenticator'
  apt:
    name: libpam-google-authenticator
    state: present
    update_cache: yes

- name: Ensure /etc/pam.d/sshd file exists
  file:
    path: /etc/pam.d/sshd
    state: touch

- name: Ensure pam_google_authenticator.so is present in /etc/pam.d/sshd
  lineinfile:
    path: /etc/pam.d/sshd
    line: 'auth required pam_google_authenticator.so nullok'
    state: present

- name: Add condition for users in users.yml for 2FA in /etc/pam.d/sshd
  lineinfile:
    path: /etc/pam.d/sshd
    insertafter: 'auth required pam_google_authenticator.so nullok'
    line: 'auth required pam_permit.so'
    state: present

- name: Disable default auth mechanism (password) in PAM
  lineinfile:
    path: /etc/pam.d/sshd
    regexp: '^@include common-auth'
    line: '#@include common-auth'
    state: present

- name: Ensure SSH server is installed
  ansible.builtin.package:
    name: openssh-server
    state: present
  become: yes

- name: Check short Diffie-Hellman keys
  ansible.builtin.shell: |
    awk '$5 < 3071' /etc/ssh/moduli | grep -q . && echo "found" || echo "none"
  register: short_dh_keys
  changed_when: false

- name: Remove short Diffie-Hellman keys
  ansible.builtin.shell: |
    awk '$5 >= 3071' /etc/ssh/moduli > /etc/ssh/moduli.safe
    mv /etc/ssh/moduli.safe /etc/ssh/moduli
  when: '"found" in short_dh_keys.stdout'
  become: yes

# Cleanup weak server keys
- name: Remove existing SSH host keys except for RSA and ED25519
  ansible.builtin.command:
    cmd: "find /etc/ssh -type f -name 'ssh_host_*' ! -name 'ssh_host_rsa_key' ! -name 'ssh_host_ed25519_key' -exec rm -f {} +"
- name: Generate new RSA SSH host key if it does not exist
  ansible.builtin.command:
    cmd: "ssh-keygen -t rsa -b 4096 -f /etc/ssh/ssh_host_rsa_key -N ''"
  args:
    creates: /etc/ssh/ssh_host_rsa_key

- name: Generate new ED25519 SSH host key if it does not exist
  ansible.builtin.command:
    cmd: "ssh-keygen -t ed25519 -f /etc/ssh/ssh_host_ed25519_key -N ''"
  args:
    creates: /etc/ssh/ssh_host_ed25519_key

# Allow only Strong server keys
- name: Ensure HostKey for ED25519 is present in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "HostKey /etc/ssh/ssh_host_ed25519_key"

- name: Ensure HostKey for RSA is present in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    line: "HostKey /etc/ssh/ssh_host_rsa_key"

- name: Set AuthenticationMethods to publickey,keyboard-interactive
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AuthenticationMethods'
    line: 'AuthenticationMethods publickey,keyboard-interactive'
    state: present

- name: Enable ChallengeResponseAuthentication in SSHD Config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ChallengeResponseAuthentication'
    line: 'ChallengeResponseAuthentication yes'
    state: present

- name: Enable PubkeyAuthentication in SSHD Config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'
    state: present

- name: Disable SSH root login so all maintainers log in as their own user
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
    state: present
  when: ansible_user != "root"

- name: Disable root account login completely
  ansible.builtin.command:
    cmd: passwd -l root
  become: yes
  when: ansible_user != "root"

- name: Enable KbdInteractiveAuthentication in SSHD Config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?KbdInteractiveAuthentication'
    line: 'KbdInteractiveAuthentication yes'
    state: present

- name: Disable PasswordAuthentication in SSHD Config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: 'PasswordAuthentication no'
    state: present

- name: Disable PermitEmptyPasswords in SSHD Config
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords'
    line: 'PermitEmptyPasswords no'
    state: present

- name: Only require public key from the user "{{ ansible_user }}"
  blockinfile:
    path: /etc/ssh/sshd_config
    # Match block must have ending Match all
    # https://linux.die.net/man/5/sshd_config
    block: |
      Match User {{ ansible_user }}
        PasswordAuthentication no
        AuthenticationMethods publickey
      Match all
    marker: '# {mark} ANSIBLE MANAGED BLOCK FOR USER {{ ansible_user }}'
  become: yes

# For Ubuntu 24.04
- name: SSHD Restrict key exchange, cipher, and MAC algorithms (Ubuntu 24.04)
  ansible.builtin.copy:
    src: ./files/sshd_audit_hardening.24.04.conf
    dest: /etc/ssh/sshd_config.d/ssh-audit_hardening.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - ansible_facts['os_family'] == 'Debian'
    - ansible_facts['distribution'] == 'Ubuntu'
    - ansible_facts['distribution_version'] == '24.04'

- name: Ensure privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the script that requires 2FA set-up
  ansible.builtin.copy:
    src: ./files/require-2fa.sh
    dest: '{{ require_2fa_script_path }}'
    owner: root
    group: root
    mode: '0755'

# PAM lets users without a 2FA secret pass (nullok). This makes them set it up before sshd runs any command for them.
# Users that log in with an SSH key only are not checked:
# - provisioning and backup user (pgBackRest and
# - users with "two_factor: false"
- name: Require 2FA set-up before any SSH session of a user
  ansible.builtin.template:
    src: ./templates/sshd-require-2fa.conf.j2
    dest: /etc/ssh/sshd_config.d/require-2fa.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -h /etc/ssh/ssh_host_ed25519_key -f %s
  vars:
    key_only_users: >-
      {{
        [ansible_user, backup_server_user]
        + users | selectattr('two_factor', 'defined') | selectattr('two_factor', 'equalto', false) | map(attribute='name') | list
      }}
  become: yes

# Fail if sshd does not read /etc/ssh/sshd_config.d (no Include in sshd_config), as the 2FA set-up would not be required
- name: Check that sshd requires 2FA set-up
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T -C user=2fa-check,host=localhost,addr=127.0.0.1
  register: require_2fa_check
  changed_when: false
  failed_when: "'forcecommand ' ~ require_2fa_script_path not in require_2fa_check.stdout"
  become: yes

- name: Check SSH config syntax
  ansible.builtin.command:
    cmd: sshd -t
  register: check_status
  ignore_errors: yes

# When the list is set, it replaces all keys of the provisioning user, so it must include the key that the
# provisioning itself connects with. Without the list the keys are left as they are
- name: Enable logging in to the provisioning user with specified SSH keys only
  authorized_key:
    user: '{{ ansible_user }}'
    key: "{{ additional_keys_for_provisioning_user | join('\n') }}"
    exclusive: true
  when: additional_keys_for_provisioning_user | default([]) | length > 0

- name: Check if SSH service exists
  ansible.builtin.command: systemctl status ssh
  register: ssh_status
  ignore_errors: yes

- name: Restart SSH service (ssh)
  service:
    name: ssh
    state: restarted
  when: ssh_status.rc == 0
  become: yes
