- name: "Precheck if encrypted file system exists so we dont try to bootstrap"
  stat:
    path: "{{ data_file_path }}"
    get_checksum: False
  register: encryptedFileSystemPreCheck
  when: disk_encryption_key is defined

- name: Get free disk space
  ansible.builtin.shell: |
    df --block-size=G --output=avail / | grep -oP '[0-9]+'
  register: free_disk_size_result
  when:
    - disk_encryption_key is defined

- name: Normalize file size units (handles G, g, Gb, GB, etc.)
  set_fact:
    free_disk_size_gb: "{{ free_disk_size_result.stdout | int  }}"
    encrypted_file_size_gb: "{{ encrypted_disk_size | regex_replace('[^0-9]', '') | int }}"
    min_free_disk_size_gb: "{{ min_free_disk_size | regex_replace('[^0-9]', '') | int }}"
  when:
    - disk_encryption_key is defined

- name: Calculate minimum free space required by percentage of the encrypted partition
  set_fact:
    min_free_disk_percent_gb: "{{ (encrypted_file_size_gb | float * min_free_disk_percent | float / 100) | round(0, 'ceil') | int }}"
  when:
    - disk_encryption_key is defined

- name: Reserve the larger of the fixed and percentage-based minimums
  set_fact:
    required_free_disk_size_gb: "{{ [min_free_disk_size_gb | int, min_free_disk_percent_gb | int] | max }}"
  when:
    - disk_encryption_key is defined

- name: Calculate total required space (in GB)
  set_fact:
    required_size_gb: "{{ encrypted_file_size_gb | int + required_free_disk_size_gb | int }}"
  when:
    - disk_encryption_key is defined

- name: Fail if not enough free space
  fail:
    msg: >-
      Not enough free disk space on the root partition. Required: {{ required_size_gb }}G
      (encrypted partition: {{ encrypted_file_size_gb }}G + reserved headroom: {{ required_free_disk_size_gb }}G,
      i.e. the greater of {{ min_free_disk_size_gb }}G fixed minimum and {{ min_free_disk_percent }}% of the encrypted partition).
      Currently available: {{ free_disk_size_gb }}G.
      Please free up or add at least {{ required_size_gb | int - free_disk_size_gb | int }}G more to the root partition before continuing.
  when:
    - free_disk_size_gb is defined
    - required_size_gb is defined
    - disk_encryption_key is defined
    - not encryptedFileSystemPreCheck.stat.exists
    - free_disk_size_gb | int < required_size_gb | int

- name: Fail if not enough free space (allocated data partition)
  fail:
    msg: >-
      Not enough free disk space on the root partition. The encrypted partition ({{ encrypted_file_size_gb }}G)
      is already allocated, so only the reserved headroom is required as free space: {{ required_free_disk_size_gb }}G
      (the greater of {{ min_free_disk_size_gb }}G fixed minimum and {{ min_free_disk_percent }}% of the encrypted partition).
      Currently available: {{ free_disk_size_gb }}G.
      Please free up or add at least {{ required_free_disk_size_gb | int - free_disk_size_gb | int }}G more to the root partition before continuing.
  when:
    - free_disk_size_gb is defined
    - required_free_disk_size_gb is defined
    - disk_encryption_key is defined
    - encryptedFileSystemPreCheck.stat.exists
    - free_disk_size_gb | int < required_free_disk_size_gb | int

- name: "Bootstrap encrypted data folder"
  script: ./files/cryptfs/bootstrap.sh -s {{ encrypted_disk_size }} -p {{ disk_encryption_key }} -f {{ data_file_path }}
  when:
    - disk_encryption_key is defined
    - not encryptedFileSystemPreCheck.stat.exists

- name: Wait for encrypted file system
  ansible.builtin.wait_for:
    path: "{{ data_file_path }}"
    state: present
  when: disk_encryption_key is defined

- name: "Register encrypted file system"
  stat:
    path: "{{ data_file_path }}"
    get_checksum: False
  register: encryptedFileSystemPostCheck
  when: disk_encryption_key is defined

- name: Check if encrypted disk is already mounted
  shell: mount | grep -q 'cryptfs on /data'
  register: is_mounted
  ignore_errors: true
  changed_when: false
  when: disk_encryption_key is defined

- name: "Mount encrypted data folder"
  script: ../cryptfs/mount.sh -p {{ disk_encryption_key }} -f {{ data_file_path }}
  when:
    - disk_encryption_key is defined
    - encryptedFileSystemPostCheck.stat.exists
    - is_mounted.rc != 0

  # Create data directories
- name: "Create traefik data directory"
  file:
    path: /data/traefik
    state: directory
    group: 65532
    owner: 65532
- name: Check elasticsearch data directory
  stat:
    path: /data/elasticsearch
  register: elasticsearch_data

- name: "Create elasticsearch data directory"
  file:
    path: /data/elasticsearch
    state: directory
    group: 1000
    owner: 1000
    mode: g+rwx
  when: not elasticsearch_data.stat.exists

- name: "Delete metabase data directory if exists"
  file:
    path: /data/metabase
    state: absent

- name: "Delete metabase backup directory if exists"
  file:
    path: /data/backups/metabase
    state: absent

- name: Check minio data directory
  stat:
    path: /data/minio
  register: minio_data

- name: "Create minio data directory"
  file:
    path: /data/minio
    state: directory
    group: 1000
    owner: 1000
    mode: ugo+rwx
  when: not minio_data.stat.exists

- name: Check minio data backup directory
  stat:
    path: /data/backups/minio
  register: minio_data_backup

- name: "Create minio backup directory"
  file:
    path: /data/backups/minio
    state: directory
    group: 1000
    owner: 1000
    mode: ugo+rwx
  when: not minio_data_backup.stat.exists

- name: Check vsexport data directory
  stat:
    path: /data/vsexport
  register: vsexport_data

- name: "Create vsexport data directory"
  file:
    path: /data/vsexport
    state: directory
    group: 1000
    owner: 1000
    mode: ugo+rwx
  when: not vsexport_data.stat.exists

- name: Check vsexport data backup directory
  stat:
    path: /data/backups/vsexport
  register: vsexport_data_backup

- name: "Create vsexport backup directory"
  file:
    path: /data/backups/vsexport
    state: directory
    group: 1000
    owner: 1000
    mode: ugo+rwx
  when: not vsexport_data_backup.stat.exists

- name: "Create acme file for traefik"
  file:
    path: /data/traefik/acme.json
    state: touch
    owner: 65532
    group: 65532
    # Owner has rw, others no permissions
    mode: "0600"

- name: "Create certs directory for traefik"
  file:
    path: /data/traefik/certs
    state: directory
    owner: 65532
    group: 65532
    # Owner has rwx, group r, others no permissions
    mode: "0740"
