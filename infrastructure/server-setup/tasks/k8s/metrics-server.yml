# TODO: Make Kubernetes components
# kubectl downloads the manifest of the pinned release itself, there is no file to protect
- name: Install metrics server {{ metrics_server_version }} on control plane
  shell: |
    kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml
  become: yes
  environment:
    KUBECONFIG: /home/{{ provisioning_user }}/.kube/config

- name: Add --kubelet-insecure-tls to metrics-server
  shell: |
    kubectl -n kube-system patch deployment metrics-server \
    --type='json' \
    -p='[{"op": "add", "path": "/spec/template/spec/containers/0/args/-", "value": "--kubelet-insecure-tls"}]'
  environment:
    KUBECONFIG: /home/{{ provisioning_user }}/.kube/config

- name: Wait for metrics server to be ready
  shell: |
    kubectl wait --for=condition=ready pod -l k8s-app=metrics-server -n kube-system --timeout=30s
  become: yes
  retries: 5
  delay: 30
  environment:
    KUBECONFIG: /home/{{ provisioning_user }}/.kube/config

- name: Verify metrics server installation
  shell: |
     kubectl get deployment metrics-server -n kube-system
  become: yes
  register: metrics_server_status
  environment:
    KUBECONFIG: /home/{{ provisioning_user }}/.kube/config
- name: Display metrics server status
  debug:
    msg: "Metrics server is installed and running: {{ metrics_server_status.stdout }}"
  when: metrics_server_status.rc == 0
