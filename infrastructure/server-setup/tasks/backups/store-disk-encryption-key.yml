- block:
    - name: Check if encrypted disk encryption key exists
      ansible.builtin.stat:
        path: "{{ remote_disk_encryption_key_path }}.enc"
      register: encryption_keyfile_stat
      when: disk_encryption_key is defined

    - name: Decrypt existing disk encryption key
      ansible.builtin.shell: |
        export KEY_ENCRYPTION_PASSPHRASE="${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}"

        openssl enc -d -aes-256-cbc -pbkdf2 \
          -pass env:KEY_ENCRYPTION_PASSPHRASE \
          -in "{{ remote_disk_encryption_key_path }}.enc" \
          -out "{{ remote_disk_encryption_key_path }}"
      args:
        executable: /bin/bash
      no_log: true
      when:
        - disk_encryption_key is defined
        - encryption_keyfile_stat.stat.exists

    - name: Read existing disk encryption key
      ansible.builtin.slurp:
        src: "{{ remote_disk_encryption_key_path }}"
      register: existing_disk_encryption_key
      no_log: true
      when:
        - disk_encryption_key is defined
        - encryption_keyfile_stat.stat.exists

    - name: Fail if key exists and differs
      ansible.builtin.fail:
        msg: "Disk encryption key on disk does not match ansible variable! GitHub secret ENCRYPTION_KEY was updated!"
      when:
        - disk_encryption_key is defined
        - encryption_keyfile_stat.stat.exists
        - existing_disk_encryption_key.content | b64decode != ("DISK_ENCRYPTION_KEY=" ~ disk_encryption_key ~ "\n")

    - name: Save disk encryption key into a file
      ansible.builtin.copy:
        dest: "{{ remote_disk_encryption_key_path }}"
        group: 1000
        owner: 1000
        mode: "0600"
        content: |
          DISK_ENCRYPTION_KEY={{ disk_encryption_key }}
      no_log: true
      when: disk_encryption_key is defined

    - name: Encrypt disk encryption key
      ansible.builtin.shell: |
        export KEY_ENCRYPTION_PASSPHRASE="{{ backup_encryption_passphrase }}"

        openssl enc -aes-256-cbc -pbkdf2 \
          -pass env:KEY_ENCRYPTION_PASSPHRASE \
          -in "{{ remote_disk_encryption_key_path }}" \
          -out "{{ remote_disk_encryption_key_path }}.enc"
      args:
        executable: /bin/bash
      no_log: true
      when: disk_encryption_key is defined

  always:
    - name: Remove plaintext disk encryption key
      ansible.builtin.file:
        path: "{{ remote_disk_encryption_key_path }}"
        state: absent