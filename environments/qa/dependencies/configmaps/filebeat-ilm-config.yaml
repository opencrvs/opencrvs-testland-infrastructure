apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-ilm-config-qa
  namespace: opencrvs-deps-qa
data:
  filebeat-rollover-policy.json: |
    {
      "policy": {
        "phases": {
          "hot": {
            "min_age": "0ms",
            "actions": {
              "rollover": {
                "max_age": "1d",
                "max_primary_shard_size": "10gb"
              }
            }
          },
          "delete": {
            "min_age": "6d",
            "actions": {
              "delete": {
                "delete_searchable_snapshot": true
              }
            }
          }
        },
        "_meta": {
          "managed": true,
          "description": "ILM policy for qa: 1 day rollover, delete 6 days after rollover (about 7 days retention)"
        }
      }
    }
