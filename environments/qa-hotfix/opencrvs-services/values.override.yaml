##################################################################################
# Environment-specific Helm overrides managed by yarn environment:init
# Unmanaged keys are preserved when this file is updated.
##################################################################################
hostname: qa-hotfix.opencrvs.dev

env:
  APN_SERVICE_URL: apm-server.opencrvs-deps-qa.svc.cluster.local
  APN_ENVIRONMENT: qa-hotfix

otel:
  enabled: true
  deployment_environment: qa-hotfix
  exporter_otlp_endpoint: "http://opentelemetry-collector.opencrvs-deps-qa.svc.cluster.local:4318"

countryconfig:
  image:
    name: opencrvs-testland
  env:
    # MOSIP Mock
    OPENID_PROVIDER_CLAIMS: name,family_name,given_name,middle_name,birthdate,address
    OPENID_PROVIDER_CLIENT_ID: mock-client_id
    ESIGNET_REDIRECT_URL: https://esignet-mock.qa-hotfix.opencrvs.dev/authorize
    MOSIP_API_USERINFO_URL: https://mosip-api.qa-hotfix.opencrvs.dev/esignet/get-oidp-user-info
    E2E_MINIO_BASE_URL: https://minio.qa-hotfix.opencrvs.dev
    # Verifiable Credentials
    VERIFIABLE_CREDENTIALS_SDJWT_ISSUE_URL: https://proxy.issuer.opencrvs.dev/openid4vc/sdjwt/issue
    VERIFIABLE_CREDENTIALS_RAW_JWT_SIGN_URL: https://proxy.issuer.opencrvs.dev/raw/jwt/sign

  secrets:
    reference-data-db-secret:
      - REFERENCE_DATA_DATABASE_URL
    # Country config seeds the MOSIP integration in the events service on
    # startup with exactly this client id/secret, so mosip-api can authenticate
    # as itself using the same pair (see environments/qa-hotfix/mosip-api).
    # OPENCRVS_MOSIP_CLIENT_ID must be a UUID — countryconfig validates it at
    # boot and exits if it is malformed.
    mosip-integration-secret:
      - OPENCRVS_MOSIP_CLIENT_ID:MOSIP_INTEGRATION_CLIENT_ID
      - OPENCRVS_MOSIP_CLIENT_SECRET:MOSIP_INTEGRATION_CLIENT_SECRET

postgres_on_deploy:
  secrets:
    reference-data-db-secret:
      - REFERENCE_DATA_POSTGRES_USER
      - REFERENCE_DATA_POSTGRES_PASSWORD
      - REFERENCE_DATA_EDITOR_USER
      - REFERENCE_DATA_EDITOR_PASSWORD
