##################################################################################
# DON'T MODIFY THIS FILE
# File was generated by "yarn environment:init"
# File will be overwritten on next run of this script
# Please use values.override.yaml to modify helm chart behavior
# make sure your custom changes doesn't conflict with values.yaml
##################################################################################

########################################################################################
# Initial configuration file for OpenCRVS installation
########################################################################################
# Some properties are not defined in this file and should be provided as key/value at
# installation time:
# - hostname: valid DNS name for opencrvs
# - countryconfig.image.name: Countryconfig image repository
# - countryconfig.image.tag: Countryconfig image tag
environment_type: non-production

hpa:
  enabled: false

env:
  APN_SERVICE_URL: "http://apm-server.opencrvs-deps-e2e.svc.cluster.local:8200"
  S3_BUCKET: ocrvs


elasticsearch:
  host: elasticsearch.opencrvs-deps-e2e.svc.cluster.local

s3:
  host: rustfs-0.rustfs.opencrvs-deps-e2e.svc.cluster.local

redis:
  host: redis-0.redis.opencrvs-deps-e2e.svc.cluster.local

postgres:
  host: postgres-0.postgres.opencrvs-deps-e2e.svc.cluster.local

platform:
  imagePullSecrets:
    # Default value for credentials created while yarn environment:init
    - name: dockerhub-credentials

auth:
  env:
    TWO_FA_ENABLED: false

events:
  env:
    TWO_FA_ENABLED: false

countryconfig:
  secrets:
    country-config-client:
      - COUNTRY_CONFIG_CLIENT_ID
      - COUNTRY_CONFIG_CLIENT_SECRET

dashboards:
  use_default_credentials: true
  enabled: true

on_restore_cronjob:
  enabled: false
