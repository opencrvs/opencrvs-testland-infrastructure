########################################################################################
# Initial configuration file for OpenCRVS installation
########################################################################################
# Some properties are not defined in this file and should be provided as key/value at
# installation time:
# - hostname: valid DNS name for opencrvs
# - countryconfig.image.name: Countryconfig image repository
# - countryconfig.image.tag: Countryconfig image tag
environment_type: non-production

network_policy:
  ingress_mode: deny
  egress_mode: deny
  allowed_namespaces:
    - opencrvs-deps-e2e

hpa:
  enabled: false

env:
  MINIO_BUCKET: ocrvs
  OPENCRVS_ENVIRONMENT: e2e

otel:
  enabled: true
  deployment_environment: e2e
  exporter_otlp_endpoint: "opentelemetry-collector.opencrvs-deps-e2e.svc.cluster.local:4317"

elasticsearch:
  auth_mode: auto
  host: elasticsearch.opencrvs-deps-e2e.svc.cluster.local

minio:
  auth_mode: use_secret
  host: minio-0.minio.opencrvs-deps-e2e.svc.cluster.local

redis:
  auth_mode: use_secret
  host: redis-0.redis.opencrvs-deps-e2e.svc.cluster.local

postgres:
  auth_mode: auto
  host: postgres-0.postgres.opencrvs-deps-e2e.svc.cluster.local

platform:
  imagePullSecrets:
    # Default value for credentials created while yarn environment:init
    - name: dockerhub-credentials


auth:
  env:
    TWO_FA_ENABLED: false

events:
  env:
    TWO_FA_ENABLED: false

countryconfig:
  secrets:
    smtp-config:
      - ALERT_EMAIL
      - SENDER_EMAIL_ADDRESS
      - SMTP_HOST
      - SMTP_PASSWORD
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USERNAME

dashboards:
  use_default_credentials: false
  enabled: true

on_restore_cronjob:
  enabled: false
