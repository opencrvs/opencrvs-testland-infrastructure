##################################################################################
# Environment-specific Helm overrides managed by yarn environment:init
# Unmanaged keys are preserved when this file is updated.
##################################################################################
hostname: migration-production.opencrvs.dev
env:
  APN_SERVICE_URL: apm-server.opencrvs-deps-qa.svc.cluster.local
  APN_ENVIRONMENT: migration-production
countryconfig:
  env:
    OPENID_PROVIDER_CLAIMS: name,family_name,given_name,middle_name,birthdate,address
    OPENID_PROVIDER_CLIENT_ID: mock-client_id
    ESIGNET_REDIRECT_URL: https://esignet-mock.migration-production.opencrvs.dev/authorize
    MOSIP_API_USERINFO_URL: https://mosip-api.migration-production.opencrvs.dev/esignet/get-oidp-user-info
    VERIFIABLE_CREDENTIALS_SDJWT_ISSUE_URL: https://proxy.issuer.opencrvs.dev/openid4vc/sdjwt/issue
    VERIFIABLE_CREDENTIALS_RAW_JWT_SIGN_URL: https://proxy.issuer.opencrvs.dev/raw/jwt/sign
  secrets:
    reference-data-db-secret:
      - REFERENCE_DATA_DATABASE_URL
    mosip-integration-secret:
      - OPENCRVS_MOSIP_CLIENT_ID:MOSIP_INTEGRATION_CLIENT_ID
      - OPENCRVS_MOSIP_CLIENT_SECRET:MOSIP_INTEGRATION_CLIENT_SECRET
postgres_on_deploy:
  secrets:
    reference-data-db-secret:
      - REFERENCE_DATA_POSTGRES_USER
      - REFERENCE_DATA_POSTGRES_PASSWORD
      - REFERENCE_DATA_EDITOR_USER
      - REFERENCE_DATA_EDITOR_PASSWORD