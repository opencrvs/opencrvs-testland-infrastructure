dashboards-admin-user:
  type: Opaque
  data:
    # Email address for metabase admin panel login
    - OPENCRVS_METABASE_ADMIN_EMAIL
    # Password for metabase admin panel login
    - OPENCRVS_METABASE_ADMIN_PASSWORD

elasticsearch-admin-user:
  type: Opaque
  data:
    # The Elasticsearch superuser password.
    - ELASTICSEARCH_SUPERUSER_PASSWORD: ELASTIC_PASSWORD

s3-opencrvs-users:
  type: Opaque
  data:
    - S3_ADMIN_ACCESS_KEY
    - S3_ADMIN_ACCESS_KEY:S3_ACCESS_KEY
    - S3_ADMIN_SECRET_KEY
    - S3_ADMIN_SECRET_KEY:S3_SECRET_KEY

postgres-admin-user:
  type: Opaque
  data:
    - POSTGRES_USER
    - POSTGRES_PASSWORD

smtp-config:
  type: Opaque
  data:
    - SENDER_EMAIL_ADDRESS
    - SMTP_HOST
    - SMTP_PASSWORD
    - SMTP_PORT
    - SMTP_SECURE
    - SMTP_USERNAME
    - ALERT_EMAIL

# TODO:

# CONTENT_SECURITY_POLICY_WILDCARD
# This string is supplied to the clients and nginx config and ensures that the format of your domain above can be configurable for CORS purposes.

# NOTIFICATION_TRANSPORT
# A prop which can be used to configure either Email or SMS for staff and beneficiary comms or potentially both.

# One time password while installation
opencrvs-superuser:
  type: Opaque
  data:
    - SUPER_USER_PASSWORD


reference-data-db-secret:
  type: Opaque
  data:
    - REFERENCE_DATA_POSTGRES_USER
    - REFERENCE_DATA_POSTGRES_PASSWORD
    - REFERENCE_DATA_DATABASE_URL
    - REFERENCE_DATA_EDITOR_USER
    - REFERENCE_DATA_EDITOR_PASSWORD

mosip-integration-secret:
  type: Opaque
  data:
    - OPENCRVS_MOSIP_CLIENT_ID
    - OPENCRVS_MOSIP_CLIENT_SECRET
