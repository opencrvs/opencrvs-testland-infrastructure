name: 06. Reset 2FA
run-name: "Reset 2FA from user ${{ inputs.user }} in ${{ inputs.environment }} environment"
on:
  workflow_dispatch:
    inputs:
      user:
        description: User to remove 2FA from
        type: string
        required: true
      environment:
        type: choice
        description: Infrastructure to provision
        default: "qa"
        required: true
        options:
          - qa
          - non-prod

permissions:
  contents: read

env:
  RESET_USER: ${{ inputs.user }}

jobs:
  approve:
    permissions:
      issues: write
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$RESET_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]]; then
            echo "❌ Error: Invalid user name. Use lowercase letters, digits, '_' or '-' (up to 32 characters)."
            exit 1
          fi
      - name: Waiting for manual approval
        if: ${{ vars.APPROVAL_REQUIRED != 'false' }}
        uses: trstringer/manual-approval@fa642940caf8412403569b28b2db4a1df08a83a3 # v1.13.1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.GH_APPROVERS }}
          minimum-approvals: 1
          issue-title: "Reset 2FA from user ${{ inputs.user }} in ${{ inputs.environment }}"
          issue-body: >
            Please approve or deny Reset 2FA from user ${{ inputs.user }} in 
            ${{ inputs.environment }} initiated from GitHub Actions by @${{ github.actor }}.

          exclude-workflow-initiator-as-approver: true

  reset:
    needs: approve
    environment: ${{ inputs.environment }}
    runs-on:
      - self-hosted
      - ${{ inputs.environment }}
      - node
    timeout-minutes: 60
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: Run Ansible Playbook
        working-directory: ./infrastructure/server-setup
        env:
          ANSIBLE_PERSISTENT_COMMAND_TIMEOUT: 10
          ANSIBLE_SSH_TIMEOUT: 10
          ANSIBLE_SSH_RETRIES: 5
          ANSIBLE_HOST_KEY_CHECKING: "False"
          ANSIBLE_FORCE_COLOR: "True"
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          ansible-galaxy collection install -r galaxy-requirements.yml

          args=(--inventory "../../environments/$ENVIRONMENT/inventory.yml")
          if [ -f "../../environments/$ENVIRONMENT/inventory-vars.yml" ]; then
            args+=(--extra-vars "@../../environments/$ENVIRONMENT/inventory-vars.yml")
          fi
          args+=(--extra-vars "$(jq -nc --arg user "$RESET_USER" '{user: $user}')")

          # Add --verbose to get more output
          ansible-playbook reset-2fa.yml "${args[@]}"
