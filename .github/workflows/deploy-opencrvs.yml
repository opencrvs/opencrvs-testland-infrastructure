name: 03. Deploy OpenCRVS
run-name: "Deploy OpenCRVS on ${{ inputs.environment }} (core: ${{ inputs.core-image-tag }})"
on:
  workflow_call:
    inputs:
      # testland (the countryconfig image) ships in core and always carries the
      # core tag, so a single core-image-tag drives both images.
      core-image-tag:
        type: string
      data-seed-enabled:
        type: boolean
      environment:
        type: string
      # Reported in the deploy summary, not acted on: the wipe happens in the
      # caller (deploy-and-e2e.yml runs clear-all-data before this workflow).
      # Undeclared until now, which made it always falsy — so every nightly
      # summary read "Reset environment: No" directly after wiping the database.
      # Deliberately not offered on workflow_dispatch: a bare dispatch resets
      # nothing, and a checkbox here would read as if it might.
      reset:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      core-image-tag:
        description: "Tag of the core image (also tags the testland/countryconfig image)"
        required: true
        default: "v2.1.0"
      data-seed-enabled:
        description: "Data seeding during deployment"
        required: false
        default: false
        type: boolean
      environment:
        description: "Target environment"
        required: true
        # `development` was the default and is not one of the options below, nor
        # is there an environments/development/ to deploy. Set to e2e because that
        # is what this dispatch is actually used for: refreshing the nightly
        # environment on demand.
        default: "e2e"
        type: choice
        options:
          - e2e
          - migration-production
          - migration-staging
          - qa
          - qa-hotfix

# Serialised per environment, so two deploys cannot interleave over one Helm
# release. A distinct group name rather than the caller's `e2e` group: sharing it
# would put this called workflow in the same group as its own parent run and let
# it cancel the run that started it. Queue rather than cancel, because a deploy
# killed mid-flight leaves a half-applied Helm release — worse than either
# outcome being prevented. Keyed on the input, so all five environments are
# covered without naming them.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  # Assuming chart version matches core image tag
  OPENCRVS_CHART_VERSION: "v2.1.0"
jobs:
  # The nightly environment is refreshed on demand by QA dispatching this workflow,
  # which would otherwise swap the deployment out from under a nightly suite
  # already running. The concurrency group above serialises deploys against
  # deploys, but during the ~19-minute test fan-out the nightly holds no job in
  # that group at all — so the group alone does not close this hole.
  guard-e2e-suite:
    name: Refuse to deploy under a running E2E suite
    runs-on: ubuntu-26.04
    # Listing workflow runs is all this job does, and an explicit grant means it
    # does not depend on whatever the repository's default token scope happens
    # to be — a guard that errors is a guard that blocks every deploy.
    permissions:
      actions: read
    steps:
      - name: Look for an in-progress "Deploy & run E2E" run
        # A called workflow sees the *caller's* event context, so
        # `workflow_dispatch` here means a human dispatched this workflow
        # directly; the nightly's own call arrives as schedule or
        # repository_dispatch and must not be refused. Kept as a step condition
        # rather than a job-level `if` so that skipping the check does not skip
        # every job that depends on it.
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'e2e'
        uses: actions/github-script@v9
        with:
          script: |
            const running = []

            for (const status of ['in_progress', 'queued']) {
              const { data } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'deploy-and-e2e.yml',
                status
              })

              // A manually dispatched "Deploy & run E2E" calls this workflow as
              // part of the same run, so without excluding the current run id it
              // would find itself and refuse to deploy.
              running.push(
                ...data.workflow_runs.filter((run) => run.id !== context.runId)
              )
            }

            if (running.length === 0) {
              core.info('No E2E suite in flight — safe to deploy.')
              return
            }

            const inFlight = running
              .map((run) => `  - ${run.html_url} (${run.status})`)
              .join('\n')

            core.setFailed(
              'Refusing to deploy to e2e: "Deploy & run E2E" is still running, and ' +
                'deploying now would swap the release out from under a live test ' +
                `suite.\n\n${inFlight}\n\nWait for it to finish, or cancel it, then dispatch this again.`
            )

  approve:
    needs: guard-e2e-suite
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Waiting for manual approval
        if: ${{ (vars.APPROVAL_REQUIRED || 'false') == 'true' }}
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ vars.GH_APPROVERS }}
          minimum-approvals: 1
          issue-title: >
            Deploy (${{ inputs.environment }}): core: ${{ inputs.core-image-tag }}

          issue-body: >
            Please approve or deny the deployment of core: ${{ inputs.core-image-tag }}
            to ${{ inputs.environment }}
            initiated from GitHub Actions by @${{ github.actor }}.

          exclude-workflow-initiator-as-approver: false

  github-to-k8s-sync-env:
    needs: approve
    uses: ./.github/workflows/github-to-k8s-sync-env.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
  validate-predeploy:
    needs: guard-e2e-suite
    uses: ./.github/workflows/validate-opencrvs.yml
    with:
      environment: ${{ inputs.environment }}
      core-image-tag: ${{ inputs.core-image-tag }}
      stage: predeploy
    secrets: inherit
  deploy:
    needs:
      - github-to-k8s-sync-env
      - validate-predeploy
    environment: ${{ inputs.environment }}
    env:
      ENV: ${{ inputs.environment }}
      BRANCH: ${{ github.ref_name }}
      GITHUB_ACTOR: ${{ github.actor }}
      CORE_IMAGE_TAG: ${{ inputs.core-image-tag }}
      # testland ships in core, so the countryconfig image carries the core tag
      COUNTRYCONFIG_IMAGE_TAG: ${{ inputs.core-image-tag }}
      # testland (packages/testland in opencrvs-core), published to ghcr by
      # core's image matrix. No "/" in the name => inherits platform.repository
      # (ghcr.io/opencrvs), resolving to ghcr.io/opencrvs/ocrvs-testland
      # (public, no pull secret needed). The companion assets image resolves to
      # ocrvs-testland:<tag>-assets.
      COUNTRYCONFIG_IMAGE_NAME: ocrvs-testland
      SENDER_EMAIL_ADDRESS: ${{ secrets.SENDER_EMAIL_ADDRESS }}
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
    runs-on:
      - self-hosted
      - k8s
      - ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
      - name: Generate summary
        env:
          PUBLIC_DOMAIN: ${{ vars.DOMAIN }}
        run: |
          # GitHub strips style attributes from step summaries, so the colours
          # these used to carry never rendered — and they had Yes green and No
          # red besides.
          if [ "${{ inputs.reset }}" = "true" ]; then
            RESET_MARK="⚠️ Yes — the database was wiped before this deploy"
          else
            RESET_MARK="✅ No"
          fi
          SUMMARY=$(cat <<EOF
          ### Deployment Summary

          | Key | Value |
          |-----|-------|
          | Environment URL | https://$PUBLIC_DOMAIN |
          | Core image tag | \`${{ inputs.core-image-tag }}\` |
          | Branch name | \`${{ github.ref_name }}\` |
          | Reset environment | $RESET_MARK |
          EOF
          )
          echo "$SUMMARY" | sed 's/^          //' >> $GITHUB_STEP_SUMMARY
      - name: Create namespace
        run: kubectl create namespace "opencrvs-${ENV}" || true
      - name: Copy secrets from dependencies into application namespace
        # Only redis secret for now needs to be copied
        run: |
          secrets=(
            "elasticsearch-admin-user"
            "redis-opencrvs-users"
            "minio-opencrvs-users"
            "postgres-admin-user"
          )
          for secret in "${secrets[@]}"; do
            kubectl get secret $secret -n opencrvs-deps-${ENV} -o yaml \
            | sed "s#namespace: opencrvs-deps-${ENV}#namespace: opencrvs-${ENV}#" \
            | grep -vE 'resourceVersion|uid|creationTimestamp' \
            | kubectl apply -n opencrvs-${ENV} -f - \
            || echo "Secret $secret doesn't exist in opencrvs-deps-${ENV} namespace"
          done

      - name: Deploy with Helm
        id: deploy
        run: |
          stern -n "opencrvs-${ENV}" \
            --since 1s \
            --tail 0 \
            --exclude 'kube-probe' \
            --exclude '"level":(30|info)' \
            --template '{{.PodName}}/{{.ContainerName}} | {{.Message}}{{"\n"}}' \
            . &
          STERN_PID=$!
          touch environments/${ENV}/opencrvs-services/values.override.yaml
          helm upgrade --install opencrvs oci://ghcr.io/opencrvs/opencrvs-services:${OPENCRVS_CHART_VERSION} \
            --timeout 15m \
            --namespace "opencrvs-${ENV}" \
            -f environments/${ENV}/opencrvs-services/values.yaml \
            -f environments/${ENV}/opencrvs-services/values.override.yaml \
            --create-namespace \
            --atomic \
            --wait \
            --wait-for-jobs \
            --set-string platform.tag="$CORE_IMAGE_TAG" \
            --set-string countryconfig.image.tag="$COUNTRYCONFIG_IMAGE_TAG" \
            --set countryconfig.image.name="$COUNTRYCONFIG_IMAGE_NAME" \
            --set-string platform.imagePullPolicy=Always \
            --set-string countryconfig.image.pullPolicy=Always \
            --set data_seed.env.ACTIVATE_USERS="${{ vars.ACTIVATE_USERS || 'false' }}" \
            --set data_seed.enabled="${{ inputs.data-seed-enabled }}" \
            --set env.CONTENT_SECURITY_POLICY_WILDCARD="${{ vars.CONTENT_SECURITY_POLICY_WILDCARD }}" \
            --set hostname=${{ vars.DOMAIN }} 2>&1 ; STATUS=$?;

            kill $STERN_PID 2>/dev/null || true
            exit $STATUS
      - name: Cleanup Helm Locks
        if: failure() || cancelled()
        run: |
          kubectl -n "opencrvs-${ENV}" get secrets -l owner=helm -o json | \
          jq -r '.items[] | select(.metadata.labels.status=="pending-install" or .metadata.labels.status=="pending-upgrade" or .metadata.labels.status=="pending-rollback") | .metadata.name' | \
          xargs -r kubectl -n "opencrvs-${ENV}" delete secret || \
          echo "No helm locks found, all is good"
      - name: Send email
        if: always()
        run: |
          echo "OpenCRVS deployment status: ${{ steps.deploy.outcome }}"
          subject="🚀 OpenCRVS deployment to '$ENV' completed successfully"
          if [ "${{ steps.deploy.outcome }}" == 'failure' ]; then
            subject="⚠️ OpenCRVS deployment to '$ENV' has failed"
          fi
          EMAIL_PAYLOAD="{
            \"subject\": \"$subject\",
            \"html\": \"${subject} with image tag '$CORE_IMAGE_TAG'.<br/>Deployed by GitHub user: @${GITHUB_ACTOR}\",
            \"from\": \"${SENDER_EMAIL_ADDRESS}\",
            \"to\": \"${ALERT_EMAIL}\"
          }"

          curl -X POST http://countryconfig.opencrvs-$ENV.svc.cluster.local:3040/email \
               -H 'Content-Type: application/json' \
               -d "$EMAIL_PAYLOAD" \
               --connect-timeout 5 \
               --max-time 10 \
               --fail \
               --silent \
               --show-error || echo "Error: Failed to reach countryconfig service"
  validate-postdeploy:
    needs: deploy
    uses: ./.github/workflows/validate-opencrvs.yml
    with:
      environment: ${{ inputs.environment }}
      core-image-tag: ${{ inputs.core-image-tag }}
      stage: postdeploy
    secrets: inherit
