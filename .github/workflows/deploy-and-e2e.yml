name: Deploy & run E2E
run-name: 'E2E by ${{ github.event.client_payload.actor || github.actor }} (core: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }})'
on:
  repository_dispatch:
    types: [run_e2e]
  workflow_dispatch:
    inputs:
      core-image-tag:
        description: Core image tag (also tags the testland image — testland ships in core)
        required: true
        default: 'develop'
      core-branch:
        description: Core branch to run the e2e suite from
        required: false
        default: 'develop'

concurrency:
  group: 'e2e'
  cancel-in-progress: true

env:
  DOMAIN: ${{ vars.DOMAIN }}

jobs:
  debug:
    name: Debug output
    runs-on: ubuntu-24.04
    steps:
      - name: Print Entire Event Payload
        run: |
          echo "${{ toJson(github.event) }}"
  reset-data:
    uses: ./.github/workflows/clear-all-data.yml
    with:
      environment: 'e2e'
    secrets: inherit

  cache-node-js:
    name: Cache Node.js dependencies
    runs-on: ubuntu-24.04
    steps:
      # testland resolves @opencrvs/toolkit as a yarn workspace, so toolkit and
      # its build inputs (commons, events) must be checked out and built from
      # the same core ref — otherwise yarn would fall back to the npm-published
      # toolkit and tests would not see the ref's toolkit changes.
      - uses: actions/checkout@v6
        with:
          repository: 'opencrvs/opencrvs-core'
          ref: ${{ github.event.client_payload.core-branch || inputs.core-branch }}
          sparse-checkout: |
            development-environment
            packages/testland
            packages/toolkit
            packages/commons
            packages/events

      # Cone-mode sparse checkout always includes root files, so the monorepo
      # root .nvmrc is available even though packages/testland has none.
      - name: Set up Node.js from core .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Root yarn workspace install hoists dependencies to the repo-root
      # node_modules, so that (plus each package's local node_modules) is what
      # has to be cached — not just packages/testland. Build outputs are not
      # cached; the toolkit chain rebuilds in every job (fast).
      - name: Cache Node.js dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            node_modules
            packages/testland/node_modules
            packages/toolkit/node_modules
            packages/commons/node_modules
            packages/events/node_modules
            ~/.cache/yarn/v6
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        uses: nick-fields/retry@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: yarn

      - uses: nick-fields/retry@v4
        name: Install Playwright Browsers
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd packages/testland && npx playwright install --with-deps

  data-seed:
    uses: ./.github/workflows/seed-data.yml
    if: '!cancelled()'
    needs: reset-data
    with:
      environment: 'e2e'
    secrets: inherit
  deploy:
    uses: ./.github/workflows/deploy-opencrvs.yml
    if: '!cancelled()'
    needs:
      - reset-data
      - data-seed
    with:
      core-image-tag: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }}
      # testland ships in core, so the countryconfig image carries the core tag
      countryconfig-image-tag: ${{ github.event.client_payload.core-image-tag || inputs.core-image-tag }}
      environment: 'e2e'
      data-seed-enabled: true
    secrets: inherit

  test:
    needs: [debug, deploy, cache-node-js]
    if: "!cancelled() && needs.deploy.result == 'success'"
    runs-on: ubuntu-24.04
    environment: 'e2e'
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        # Since we are not yet in a place where we can reliably run all tests in parallel, we will run the slowest ones first
        shard:
          [
            20,
            3,
            2,
            1,
            15,
            5,
            4,
            16,
            19,
            7,
            17,
            8,
            9,
            12,
            14,
            18,
            6,
            10,
            11,
            13
          ]
    name: shard-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'opencrvs/opencrvs-core'
          ref: ${{ github.event.client_payload.core-branch || inputs.core-branch }}
          sparse-checkout: |
            development-environment
            packages/testland
            packages/toolkit
            packages/commons
            packages/events

      - name: Set up Node.js from core .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache Node.js dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: |
            node_modules
            packages/testland/node_modules
            packages/toolkit/node_modules
            packages/commons/node_modules
            packages/events/node_modules
            ~/.cache/yarn/v6
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-node-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn
      - name: Build toolkit (with commons and events)
        run: yarn --cwd packages/toolkit build:all
      - uses: nick-fields/retry@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd packages/testland && npx playwright install --with-deps
      - name: Run Playwright Tests
        working-directory: packages/testland
        run: |
          export NODE_EXTRA_CA_CERTS=/tmp/letsencrypt-stg-root-x1.pem
          curl -s -o $NODE_EXTRA_CA_CERTS https://letsencrypt.org/certs/staging/letsencrypt-stg-root-x1.pem
          npx playwright test --shard=${{ matrix.shard }}/20
      - id: ctrf_check
        if: '!cancelled()'
        working-directory: packages/testland
        run: |
          [ -d ctrf ] && \
           echo "ctrf=true" >> $GITHUB_OUTPUT || \
           echo "ctrf=false" >> $GITHUB_OUTPUT
      - name: Publish Test Report
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './packages/testland/ctrf/*.json'
          github-report: true
          summary-report: true
          test-report: true
        if: "!cancelled() && steps.ctrf_check.outputs.ctrf == 'true'"
      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: playwright-report-e2e-shard-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/testland/playwright-report/
          retention-days: 30

  # Cancelled runs (superseded by a newer trigger) notify nobody: failure()
  # and success() are both false for them.
  notify-slack:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [cache-node-js, reset-data, data-seed, deploy, test]
    if: failure()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C08FCLKER8X'
          slack-message: "❌ E2E pipeline triggered by ${{ github.event.client_payload.actor || github.actor }} failed. Check the logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  notify-slack-success:
    name: Notify Slack on success
    runs-on: ubuntu-latest
    needs: [cache-node-js, reset-data, data-seed, deploy, test]
    if: success()
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: 'C08FCLKER8X'
          slack-message: '✅ E2E pipeline finished successfully, triggered by ${{ github.event.client_payload.actor || github.actor }}. Check the logs at https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}.'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
