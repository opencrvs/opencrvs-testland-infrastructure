# Starts a release on its line's branch, release/<major>.<minor>.x. All the
# patch releases of a line are made on that branch.
#
# opencrvs-core's init-release dispatches this workflow from develop after
# each release, with the next patch version. It can also run manually.
#
# What this workflow does, in order:
#   1. It finds the line branch. If the branch does not exist, it creates it:
#        - from develop for the first release of a line (z = 0)
#        - from the tag of the previous patch (z > 0)
#   2. It bumps the version in package.json, the chart versions and the
#      default image tags, and adds a "## <version>" section to CHANGELOG.md.
#      It skips each change that is already there, so a re-run is safe.
#   3. It creates a draft GitHub release.
name: 11. Release - Start a new release
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: 'Version to release'
      # opencrvs-core sends this input to all its companion repos. This
      # workflow finds the line branch from the version, so it does not use it.
      target_branch:
        type: string
        required: false
        description: 'Not used. opencrvs-core sends it to all its companion repos.'

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  release_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the release line
        id: line
        run: |
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a semver version, e.g. 2.1.4"
            exit 1
          fi

          IFS='.' read -r x y z <<< "$VERSION"
          line="$x.$y.x"
          if [ "$z" = "0" ]; then
            base=develop
          else
            base="v$x.$y.$((z - 1))"
          fi

          echo "branch=release/$line" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # Full history and the tags are required to cut a missing line branch
      # from the tag of the previous patch.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.INFRASTRUCTURE_WORKFLOW_TOKEN }}

      - name: Configure the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check out the line branch
        env:
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
          BASE: ${{ steps.line.outputs.base }}
        run: |
          if git ls-remote --exit-code --heads origin "$LINE_BRANCH" > /dev/null; then
            git checkout -B "$LINE_BRANCH" "origin/$LINE_BRANCH"
            exit 0
          fi

          if [ "$BASE" = "develop" ]; then
            start=origin/develop
          elif git rev-parse -q --verify "refs/tags/$BASE" > /dev/null; then
            start="$BASE"
          else
            echo "::error::$LINE_BRANCH does not exist, and the tag $BASE of the previous patch does not exist. Create $LINE_BRANCH by hand."
            exit 1
          fi

          echo "$LINE_BRANCH does not exist. It is created from $start."
          git checkout -b "$LINE_BRANCH" "$start"

      # sed changes only the lines that hold a version, so the rest of each
      # file stays byte for byte the same.
      - name: Bump the version and add a CHANGELOG section
        env:
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          current=$(jq -r .version package.json)
          sed -i "0,/\"version\": \"$current\"/s//\"version\": \"$VERSION\"/" package.json
          sed -i \
            -e "s/^\(\s*OPENCRVS_CHART_VERSION:\s*\).*/\1\"v$VERSION\"/" \
            -e '/core-image-tag:/,/default:/ s/default: ".*"/default: "'"v$VERSION"'"/' \
            .github/workflows/deploy-opencrvs.yml
          sed -i \
            -e "s/^\(\s*DEPENDENCIES_CHART_VERSION:\s*\).*/\1\"v$VERSION\"/" \
            .github/workflows/deploy-dependencies.yml

          if git diff --quiet; then
            echo "The versions are already on $VERSION."
          else
            git commit -am "chore: update version to $VERSION"
          fi

          # A section from the old flow can still say "Release Candidate".
          if grep -qxE "## ${VERSION//./\\.}( Release Candidate)?" CHANGELOG.md; then
            echo "CHANGELOG.md already has a $VERSION section."
          else
            # Insert "## <version>" right below the "# Changelog" header.
            sed -i "0,/^# Changelog$/s//# Changelog\n\n## $VERSION/" CHANGELOG.md
            if ! grep -qx "## $VERSION" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '# Changelog' line, so the $VERSION section was not added."
              exit 1
            fi
            git commit -am "docs: add $VERSION to the changelog"
          fi

          git push origin "$LINE_BRANCH"

      # The draft gives the release notes a place while the release is in
      # progress. The workflow deletes its tag again, so that no tag points at
      # code that is not released. The tag is created again when the release
      # is published. See release-steps.md in opencrvs-core.
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINE_BRANCH: ${{ steps.line.outputs.branch }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          git tag "$TAG" "origin/$LINE_BRANCH"
          git push origin "$TAG"
          gh release create "$TAG" --draft \
            --title "OpenCRVS - $TAG" \
            --notes "Release notes for version $VERSION"

          git tag -d "$TAG"
          git push origin ":refs/tags/$TAG"
